<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="main">
        <h1>Tic Tac Toe</h1>
        <div class="control-buttons">
            <button class="game-control new">new game</button>
            <button class="game-control play" hidden>start round</button>
            <button class="game-control clear" hidden>clear board</button>
        </div>
        <div class="game-text">This is just some test text.</div>
        <div class="board-wrapper"></div>
        <div class="players-wrapper">
            <div>
                <h2>Charlie</h2>
                <p>marker: X</p>
                <p>score: 0</p>
            </div>
            <div>
                <h2>Patty</h2>
                <p>marker: O</p>
                <p>score: 2</p>
            </div>
        </div>
    </div>
</body>
</html>
