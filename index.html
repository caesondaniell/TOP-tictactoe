<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="main">
        <h1>Tic Tac Toe</h1>
        <div class="control-buttons">
            <button class="game-control new">new game</button>
            <button hidden class="game-control reset">reset</button>
        </div>
        <div class="game-text"></div>
        <div class="board-wrapper">
            <button disabled class="grid-square" data-position="0"></button>
            <button disabled class="grid-square" data-position="1"></button>
            <button disabled class="grid-square" data-position="2"></button>
            <button disabled class="grid-square" data-position="3"></button>
            <button disabled class="grid-square" data-position="4"></button>
            <button disabled class="grid-square" data-position="5"></button>
            <button disabled class="grid-square" data-position="6"></button>
            <button disabled class="grid-square" data-position="7"></button>
            <button disabled class="grid-square" data-position="8"></button>
        </div>
        <div class="players-wrapper">
            <div>
                <h2 class="p1-name"></h2>
                <p class="p1-mark"></p>
                <p class="p1-score"></p>
            </div>
            <div>
                <h2 class="p2-name"></h2>
                <p class="p2-mark"></p>
                <p class="p2-score"></p>
            </div>
        </div>
    </div>
</body>
</html>
